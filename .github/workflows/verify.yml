name: Verify certificate

on: [push, pull_request]

jobs:
  fast-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      # No quadrature here, just the serialized LDL^* replay.
      - name: Replay the certificate
        run: |
          mkdir -p build
          python certificate/validate.py \
            --ledger certificate/ledger.json \
            --output build/recomputed.json \
            --precision 256
          cmp build/recomputed.json \
            certificate/schur-lmi.json

      - name: Check artifact hashes
        run: sha256sum -c SHA256SUMS
